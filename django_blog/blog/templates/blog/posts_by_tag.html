{% extends 'blog/base.html' %}
{% block content %}
<h2>Posts tagged "{{ view.kwargs.tag_slug }}"</h2>
{% for post in posts %}
    <h3><a href="{% url 'post-detail' post.pk %}">{{ post.title }}</a></h3>
    <p>{{ post.content|truncatechars:100 }}</p>
{% empty %}
    <p>No posts found with this tag.</p>
{% endfor %}
{% endblock %}
